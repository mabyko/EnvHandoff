<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EnvHandoff Pro QA</title>
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body>
    <!-- Browser regressions mount their own screens and mock requests here. -->
    <div id="root"></div>
    <script type="module">
      const preview = new URLSearchParams(location.search).get('preview')
      if (preview === 'team') {
        document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        const { mountBetaQA } = await import('./pro-beta.browser.tsx')
        await mountBetaQA(false, true)
      }
    </script>
  </body>
</html>

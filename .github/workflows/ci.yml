name: CI

on:
  pull_request:
    branches: [main, release, 'release/**']
  push:
    branches: [main, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Required status context is also checked by release-gate.mjs.
    name: lint and typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: envhandoff
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: envhandoff_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U envhandoff -d envhandoff_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - run: npm install --global pnpm@12.3.4
      - run: pnpm install --frozen-lockfile
      - run: node .github/scripts/release-gate.mjs --self-test
      - run: node .github/scripts/migration-gate.mjs --self-test
      - name: Locate isolated test browser
        run: |
          chrome_path="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$chrome_path"
          "$chrome_path" --version
          echo "BROWSER_CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"
      - run: pnpm check
